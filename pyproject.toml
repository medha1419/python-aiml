[project]
name = "python-aiml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Medha Gupta", email = "officialguptamedha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
python-aiml = "python_aiml:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
